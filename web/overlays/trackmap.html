<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OM Trackmap</title>
<link rel="stylesheet" href="/shared/om.css">
<style>
  html, body { height: 100%; }
  .panel { height: 100%; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .note { position: absolute; left: 10px; right: 10px; bottom: 8px; font-size: 12.5px; color: var(--mist); line-height: 1.3; }
</style>
</head>
<body data-overlay="trackmap">
<div class="panel">
  <div class="om-head" id="head"></div>
  <div class="stage"><canvas id="map"></canvas><div class="note" id="note"></div></div>
</div>
<script src="/shared/link.js"></script>
<script src="/shared/om.js"></script>
<script>
  const cv = document.getElementById('map');
  const ctx = cv.getContext('2d');
  const head = document.getElementById('head');
  const note = document.getElementById('note');
  let proj = null; // projizierte Punkte in Pixeln

  function buildProjection() {
    const w = cv.clientWidth, h = cv.clientHeight;
    const cfg = OM.cfg();
    let pts = OM.track;
    if (!pts || !pts.length) {
      // Platzhalter, bis die Strecke aufgezeichnet ist
      pts = Array.from({ length: 200 }, (_, i) => { const a = (i / 200) * Math.PI * 2; return [Math.cos(a), Math.sin(a) * 0.7]; });
    }
    const rot = ((cfg.rotate || 0) * Math.PI) / 180;
    const m = cfg.mirror ? -1 : 1;
    const t = pts.map(([x, y]) => {
      const xr = x * Math.cos(rot) - y * Math.sin(rot);
      const yr = x * Math.sin(rot) + y * Math.cos(rot);
      return [xr * m, -yr]; // Bildschirm-y zeigt nach unten
    });
    const xs = t.map((p) => p[0]), ys = t.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const pad = 18;
    const s = Math.min((w - pad * 2) / (maxX - minX || 1), (h - pad * 2) / (maxY - minY || 1));
    const ox = (w - (maxX - minX) * s) / 2, oy = (h - (maxY - minY) * s) / 2;
    proj = t.map(([x, y]) => [ox + (x - minX) * s, oy + (y - minY) * s]);
  }

  function at(pct) {
    const n = proj.length;
    const f = ((pct % 1) + 1) % 1 * n;
    const i = Math.floor(f) % n, u = f - Math.floor(f);
    const a = proj[i], b = proj[(i + 1) % n];
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  }

  function draw(f) {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); proj = null;
    }
    if (!proj) buildProjection();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    // Strecke
    const path = () => { ctx.beginPath(); proj.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    path(); ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 9; ctx.stroke();
    path(); ctx.strokeStyle = OM.track ? 'rgba(242,240,234,0.75)' : 'rgba(242,240,234,0.18)'; ctx.lineWidth = 3.5; ctx.stroke();

    // Start/Ziel
    const s0 = at(0), s1 = at(0.004);
    const ang = Math.atan2(s1[1] - s0[1], s1[0] - s0[0]) + Math.PI / 2;
    ctx.strokeStyle = '#C8A24C'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(s0[0] + Math.cos(ang) * 8, s0[1] + Math.sin(ang) * 8);
    ctx.lineTo(s0[0] - Math.cos(ang) * 8, s0[1] - Math.sin(ang) * 8);
    ctx.stroke();

    if (!f) return;
    const showNum = OM.cfg().showNumbers !== false;
    const cars = [...f.map.cars].sort((a, b) => (a.me ? 1 : 0) - (b.me ? 1 : 0)); // ich zuletzt = oben
    ctx.font = '600 10px Bahnschrift, "Barlow Semi Condensed", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const c of cars) {
      if (c.pct < 0) continue;
      const [x, y] = at(c.pct);
      ctx.globalAlpha = c.pit ? 0.35 : 1;
      if (c.me) {
        ctx.fillStyle = '#C8A24C';
        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#16171A'; ctx.font = '700 10.5px Bahnschrift, "Barlow Semi Condensed", sans-serif';
        ctx.fillText(c.number, x, y + 0.5);
        ctx.font = '600 10px Bahnschrift, "Barlow Semi Condensed", sans-serif';
      } else {
        ctx.fillStyle = '#ECEAE4';
        ctx.beginPath(); ctx.arc(x, y, showNum ? 7.5 : 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = c.color || '#C8A24C'; ctx.lineWidth = 1.5; ctx.stroke();
        if (showNum) { ctx.fillStyle = '#16171A'; ctx.fillText(c.number, x, y + 0.5); }
      }
      ctx.globalAlpha = 1;
    }
  }

  window.addEventListener('resize', () => { proj = null; });

  OM.connect({
    onSettings() { proj = null; },
    onTrack() { proj = null; },
    onFrame(f, waiting) {
      OM.header(head, waiting ? 'Trackmap' : (f.track.name || 'Trackmap'), '');
      if (waiting) { note.textContent = OM.waitingText; draw(null); return; }
      note.textContent = f.map.recording
        ? `Strecke wird aus deiner Fahrt aufgezeichnet (${Math.round(f.map.progress * 100)} %). Fahr eine saubere Runde ohne Box.`
        : '';
      draw(f);
    },
  });
</script>
</body>
</html>
