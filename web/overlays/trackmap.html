<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OM Trackmap</title>
<link rel="stylesheet" href="/shared/om.css">
<style>
  html, body { height: 100%; }
  .panel { height: 100%; display: flex; flex-direction: column; }
  /* Ohne Hintergrund: nur die Strecke, wie bei RaceLab */
  body.nobg .panel { background: transparent; box-shadow: none; border: 0; }
  body.nohead .om-head { display: none; }
  .stage { position: relative; flex: 1; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .note { position: absolute; left: 10px; right: 10px; bottom: 8px; font-size: 12.5px; color: var(--chalk); line-height: 1.3;
    text-shadow: 0 1px 2px rgba(0,0,0,.9); }
</style>
</head>
<body data-overlay="trackmap">
<div class="panel">
  <div class="om-head" id="head"></div>
  <div class="stage"><canvas id="map"></canvas><div class="note" id="note"></div></div>
</div>
<script src="/shared/defaults.js"></script>
<script src="/shared/link.js"></script>
<script src="/shared/om.js"></script>
<script>
  // Streckenkarte: Asphaltband mit Rand, Kurvennummern, Start/Ziel, Sektoren, Autos, Führender,
  // Spieler, Geist der Bestrunde, Freunde, Fahrer-Label, Post-Pit, Wind. Alle Teile einstellbar
  // (Menü «Overlay-Steuerung» im Hauptfenster). Karten aller iRacing-Strecken sind hinterlegt.
  const cv = document.getElementById('map');
  const ctx = cv.getContext('2d');
  const head = document.getElementById('head');
  const note = document.getElementById('note');
  const FONT = 'Bahnschrift, "Barlow Semi Condensed", "Arial Narrow", sans-serif';
  const DEMO_CLASSES = [['GTP', '#FFDA59'], ['LMP2', '#33CEFF'], ['GT3', '#FF5888']];
  let proj = null, turns = [], unit = 1, center = [0, 0];
  const pitExit = new Map();  // idx → Zeitpunkt der Boxenausfahrt
  const wasPit = new Map();

  function cfg() {
    const c = { ...OMDefaults.OPTIONS.trackmap, ...OM.cfg() };
    const acc = OM.css('--gold');
    c.sectorColor = c.sectorColor || acc;
    c.leaderColor = c.leaderColor || acc;
    c.playerColor = c.playerColor || acc;
    return c;
  }

  function buildProjection(c) {
    const w = cv.clientWidth, h = cv.clientHeight;
    let pts = OM.track;
    const placeholder = !pts || !pts.length;
    if (placeholder) pts = Array.from({ length: 200 }, (_, i) => { const a = (i / 200) * Math.PI * 2; return [Math.cos(a), Math.sin(a) * 0.6]; });
    const rot = (Number(c.rotate) * Math.PI) / 180, m = c.mirror ? -1 : 1;
    const tf = ([x, y]) => {
      const xr = x * Math.cos(rot) - y * Math.sin(rot), yr = x * Math.sin(rot) + y * Math.cos(rot);
      return [xr * m, -yr]; // Bildschirm-y zeigt nach unten
    };
    const t = pts.map(tf);
    const tt = (!placeholder && c.showTurns ? OM.trackTurns || [] : []).map((x) => ({ t: x.t, p: tf([x.x, x.y]) }));
    const all = t.concat(tt.map((x) => x.p));
    const xs = all.map((p) => p[0]), ys = all.map((p) => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    unit = Math.max(0.6, Math.min(w, h) / 330);
    const pad = Math.max(0, Number(c.padding) || 0) + (Number(c.trackWidth) / 2 + 4) * unit;
    const s = Math.min((w - pad * 2) / (maxX - minX || 1), (h - pad * 2) / (maxY - minY || 1));
    const mw = (maxX - minX) * s, mh = (maxY - minY) * s;
    let ox = (w - mw) / 2, oy = (h - mh) / 2;
    if (c.align === 'left') ox = pad; else if (c.align === 'right') ox = w - pad - mw;
    if (c.align === 'top') oy = pad; else if (c.align === 'bottom') oy = h - pad - mh;
    const P = ([x, y]) => [ox + (x - minX) * s, oy + (y - minY) * s];
    proj = t.map(P);
    turns = tt.map((x) => ({ t: x.t, p: P(x.p) }));
    center = [ox + mw / 2, oy + mh / 2];
  }

  function at(pct) {
    const n = proj.length;
    const f = (((pct % 1) + 1) % 1) * n;
    const i = Math.floor(f) % n, u = f - Math.floor(f);
    const a = proj[i], b = proj[(i + 1) % n];
    return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
  }
  // Querrichtung (nach aussen, weg von der Kartenmitte) und Fahrtrichtung an einer Stelle
  function normal(pct) {
    const a = at(pct - 0.003), b = at(pct + 0.003), p = at(pct);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    let nx = Math.cos(ang + Math.PI / 2), ny = Math.sin(ang + Math.PI / 2);
    if ((p[0] - center[0]) * nx + (p[1] - center[1]) * ny < 0) { nx = -nx; ny = -ny; }
    return [nx, ny, ang];
  }
  const rgba = (hex, a) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex;
    const v = parseInt(m[1], 16);
    return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${a})`;
  };
  function luminance(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return 0.5;
    const v = parseInt(m[1], 16);
    return (0.299 * ((v >> 16) & 255) + 0.587 * ((v >> 8) & 255) + 0.114 * (v & 255)) / 255;
  }
  const solid = (col) => (col && col.startsWith('var(') ? OM.css(col.slice(4, -1)) : col);
  const pathLine = (from = 0, to = 1) => {
    ctx.beginPath();
    const n = proj.length, i0 = Math.floor(from * n), i1 = Math.ceil(to * n);
    for (let i = i0; i <= i1; i++) { const p = proj[((i % n) + n) % n]; i === i0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]); }
    if (from === 0 && to === 1) ctx.closePath();
  };

  // ---------- Strecke ----------
  function drawTrack(c, f, placeholder) {
    const W = Number(c.trackWidth) * unit;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (c.shadow) { pathLine(); ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = W + 7 * unit; ctx.stroke(); }
    if (c.ringShow) {
      pathLine();
      if (c.ringGlow) { ctx.shadowColor = OM.css('--gold'); ctx.shadowBlur = 10 * unit; }
      ctx.strokeStyle = placeholder ? 'rgba(255,255,255,0.12)' : rgba(c.ringColor, c.ringOpacity);
      ctx.lineWidth = W + 2 * Number(c.ringWidth) * unit; ctx.stroke();
      ctx.shadowBlur = 0;
    }
    pathLine(); ctx.strokeStyle = placeholder ? 'rgba(20,21,24,0.5)' : c.trackColor; ctx.lineWidth = W; ctx.stroke();
    if (placeholder) return;

    const sectors = (f && f.map && f.map.sectors) || [];
    // Meinen aktuellen Sektor hervorheben
    if (c.sectorHighlight && f) {
      const me = f.map.cars.find((x) => x.me);
      if (me && me.pct >= 0) {
        const b = [0, ...sectors, 1];
        let k = 0; while (k < b.length - 2 && me.pct >= b[k + 1]) k++;
        pathLine(b[k], b[k + 1]); ctx.strokeStyle = rgba(c.sectorColor, 0.28); ctx.lineWidth = W; ctx.lineCap = 'butt'; ctx.stroke(); ctx.lineCap = 'round';
      }
    }
    if (c.showSectors) {
      for (const sp of sectors) {
        const p = at(sp), [nx, ny] = normal(sp), L = W / 2 + 4 * unit;
        ctx.strokeStyle = c.sectorColor; ctx.lineWidth = Number(c.sectorWidth) * unit; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.moveTo(p[0] + nx * L, p[1] + ny * L); ctx.lineTo(p[0] - nx * L, p[1] - ny * L); ctx.stroke();
      }
      ctx.lineCap = 'round';
    }
    if (c.showDirection) { // kleiner Pfeil kurz nach Start/Ziel
      const p = at(0.03), [, , ang] = normal(0.03), s = Math.max(2.5, W * 0.38);
      ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(ang);
      ctx.strokeStyle = 'rgba(235,235,235,0.75)'; ctx.lineWidth = 1.6 * unit; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-s, -s); ctx.lineTo(0, 0); ctx.lineTo(-s, s); ctx.stroke();
      ctx.restore();
    }
    if (c.showStartFinish) { // Zielflaggen-Muster quer über die Strecke
      const s0 = at(0), [, , ang] = normal(0);
      ctx.save(); ctx.translate(s0[0], s0[1]); ctx.rotate(ang);
      const q = Math.max(2.5, (W + 7 * unit) / 5);
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-q - unit, -2.5 * q - unit, 2 * q + 2 * unit, 5 * q + 2 * unit);
      for (let r = 0; r < 2; r++) for (let k = 0; k < 5; k++) {
        ctx.fillStyle = (r + k) % 2 ? '#111' : '#F4F4F0';
        ctx.fillRect(-q + r * q, -2.5 * q + k * q, q, q);
      }
      ctx.restore();
    }
    if (c.showTurns) {
      const ts = Number(c.turnSize) || 1;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `600 ${7 * unit * ts}px ${FONT}`;
      for (const t of turns) {
        if (c.turnBg) {
          const tw = ctx.measureText(t.t).width, hh = 10 * unit * ts, ww = Math.max(hh, tw + 6 * unit * ts);
          ctx.fillStyle = 'rgba(14,15,17,0.82)';
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(t.p[0] - ww / 2, t.p[1] - hh / 2, ww, hh, hh / 2); else ctx.rect(t.p[0] - ww / 2, t.p[1] - hh / 2, ww, hh);
          ctx.fill();
        }
        ctx.fillStyle = c.turnColor;
        ctx.fillText(t.t, t.p[0], t.p[1] + 0.4 * unit * ts);
      }
    }
  }

  // ---------- Symbole ----------
  function crown(x, y, s, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x - 5 * s, y + 3 * s); ctx.lineTo(x - 5.5 * s, y - 2.5 * s); ctx.lineTo(x - 2.5 * s, y); ctx.lineTo(x, y - 3.5 * s);
    ctx.lineTo(x + 2.5 * s, y); ctx.lineTo(x + 5.5 * s, y - 2.5 * s); ctx.lineTo(x + 5 * s, y + 3 * s); ctx.closePath();
    ctx.fill();
  }
  function star(x, y, r, col) {
    ctx.fillStyle = col; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }

  // ---------- Fahrer-Label ----------
  function nameText(car, fmt) {
    if (fmt === 'num') return '#' + car.number;
    const parts = String(car.name || '').trim().split(/\s+/);
    const last = parts[parts.length - 1] || '';
    return fmt === 'short' ? last.slice(0, 3).toUpperCase() : last;
  }
  function drawLabel(car, x, y, r, c) {
    const txt = nameText(car, c.nameFormat);
    if (!txt) return;
    const [nx, ny] = normal(car.pct);
    const fs = 8 * unit * (Number(c.nameSize) || 1);
    ctx.font = `700 ${fs}px ${FONT}`;
    const tw = ctx.measureText(txt).width + 7 * unit, th = fs + 5 * unit;
    const d = r + 4 * unit + Math.max(tw, th) / 2;
    // im sichtbaren Bereich halten
    const W = cv.clientWidth, H = cv.clientHeight;
    const cx = Math.min(W - tw / 2 - 2, Math.max(tw / 2 + 2, x + nx * d));
    const cy = Math.min(H - th / 2 - 2, Math.max(th / 2 + 2, y + ny * d));
    ctx.fillStyle = car.me ? c.playerColor : 'rgba(14,15,17,0.88)';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(cx - tw / 2, cy - th / 2, tw, th, 3 * unit); else ctx.rect(cx - tw / 2, cy - th / 2, tw, th);
    ctx.fill();
    ctx.fillStyle = car.me ? OM.css('--on-accent') : '#ECEAE4';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, cx, cy + 0.5 * unit);
  }

  // ---------- Autos ----------
  function drawCars(f, c) {
    let cars = f.map.cars.filter((x) => x.pct >= 0).map((x) => ({ ...x }));
    // Demo: Multi-Class-Feld vortäuschen (nur Vorschau)
    if (f.status === 'demo' && c.demoClasses === 'multi') {
      cars.forEach((x) => { const k = x.me ? 2 : x.idx % 3; x.cls = k; x.color = DEMO_CLASSES[k][1]; });
      const byCls = {};
      [...cars].sort((a, b) => (a.pos || 99) - (b.pos || 99)).forEach((x) => { byCls[x.cls] = (byCls[x.cls] || 0) + 1; x.cpos = byCls[x.cls]; });
    }
    if (c.pitCars === 'hide') cars = cars.filter((x) => !x.pit || x.me);
    const multi = new Set(cars.map((x) => x.cls)).size > 1;
    const now = Date.now();
    // Post-Pit: Ausfahrt merken
    for (const x of cars) {
      if (wasPit.get(x.idx) && !x.pit) pitExit.set(x.idx, now);
      wasPit.set(x.idx, !!x.pit);
    }
    const friends = String(c.friends || '').split(',').map((s) => s.trim().toLowerCase()).filter(Boolean);
    const isFriend = (x) => friends.length && friends.some((t) => (x.uid && String(x.uid) === t) || (x.name && x.name.toLowerCase() === t)
      || (x.name && t.length >= 4 && x.name.toLowerCase().includes(t)));
    const lenKm = (f.track && f.track.lengthM ? f.track.lengthM : 0) / 1000;
    const sz = (Number(c.carSize) || 1) * (c.longScale && lenKm >= Number(c.longFrom) ? Number(c.longFactor) : 1);

    // Namen: wer bekommt ein Label?
    const me = cars.find((x) => x.me);
    let labelled = new Set();
    if (c.nameLabels === 'all') labelled = new Set(cars.map((x) => x.idx));
    else if (me && (c.nameLabels === 'me' || c.nameLabels === 'near')) {
      labelled.add(me.idx);
      if (c.nameLabels === 'near') {
        const rel = cars.filter((x) => !x.me && !x.pit).map((x) => ({ x, d: ((x.pct - me.pct + 1.5) % 1) - 0.5 }));
        const n = Number(c.nameNear) || 2;
        rel.filter((r) => r.d > 0).sort((a, b) => a.d - b.d).slice(0, n).forEach((r) => labelled.add(r.x.idx));
        rel.filter((r) => r.d < 0).sort((a, b) => b.d - a.d).slice(0, n).forEach((r) => labelled.add(r.x.idx));
      }
    }

    // Geist der Bestrunde (unter den Autos)
    if (c.refShow && f.map.refPct !== null && f.map.refPct !== undefined) {
      const [x, y] = at(f.map.refPct), r = 6.5 * unit * sz;
      ctx.globalAlpha = 0.9;
      if (c.refStyle === 'dot') { ctx.fillStyle = rgba(c.refColor, 0.75); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
      else { ctx.strokeStyle = c.refColor; ctx.lineWidth = 2.2 * unit; ctx.setLineDash([3 * unit, 2 * unit]); ctx.beginPath(); ctx.arc(x, y, r + 2 * unit, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
      ctx.globalAlpha = 1;
    }

    // Reihenfolge: Box zuerst, dann hinten nach vorn, ich ganz oben
    cars.sort((a, b) => (b.pit - a.pit) || (a.me - b.me) || ((b.pos || 99) - (a.pos || 99)));
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const labels = [];
    for (const car of cars) {
      const [x, y] = at(car.pct);
      const pos = multi ? car.cpos : car.pos;
      const mode = car.me && c.playerLabel !== 'same' ? c.playerLabel : c.carLabel;
      const label = mode === 'num' ? car.number : mode === 'pos' ? (pos > 0 ? pos : '') : '';
      let r = (label !== '' ? 7.5 : 5) * unit * sz * (car.pit ? 0.8 : 1);
      if (car.me) r *= Number(c.playerSize) || 1.25;
      ctx.globalAlpha = car.pit && c.pitCars === 'dim' ? 0.45 : 1;
      let fill, text;
      if (car.me) { fill = c.playerColor; text = luminance(fill) > 0.55 ? '#121316' : '#FFFFFF'; }
      else if (multi && c.classColors) { fill = solid(car.color) || c.carColor; text = luminance(fill) > 0.55 ? '#121316' : '#FFFFFF'; }
      else { fill = c.carColor; text = luminance(fill) > 0.55 ? '#121316' : '#FFFFFF'; }
      const friend = !car.me && isFriend(car);
      if (friend && c.friendStyle === 'fill') { fill = c.friendColor; text = luminance(fill) > 0.55 ? '#121316' : '#FFFFFF'; }

      if (car.me && (c.playerGlow || c.playerPulse)) {
        const k = c.playerPulse ? 0.5 + 0.5 * Math.sin(now / 260) : 0.6;
        ctx.fillStyle = rgba(fill, 0.18 + 0.22 * k);
        ctx.beginPath(); ctx.arc(x, y, r + (3 + 4 * (c.playerPulse ? k : 0.6)) * unit, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = fill;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      if (car.me) { ctx.lineWidth = 2 * unit; ctx.strokeStyle = '#FFFFFF'; ctx.stroke(); }
      else if (c.carOutline) { ctx.lineWidth = 1.4 * unit; ctx.strokeStyle = 'rgba(10,10,12,0.75)'; ctx.stroke(); }
      if (friend && c.friendStyle !== 'fill') {
        ctx.lineWidth = 2.2 * unit; ctx.strokeStyle = c.friendColor;
        ctx.beginPath(); ctx.arc(x, y, r + 2.5 * unit, 0, Math.PI * 2); ctx.stroke();
      }
      if (label !== '') {
        const str = String(label);
        ctx.font = `700 ${(car.me ? 8.5 * (Number(c.playerSize) || 1.25) / 1.05 : str.length > 2 ? 7 : 8.5) * unit * sz}px ${FONT}`;
        ctx.fillStyle = text;
        ctx.fillText(str, x, y + 0.6 * unit);
      }
      // Führender (gesamt oder je Klasse)
      const lead = c.leaderShow && !car.pit && (c.leaderPerClass && multi ? car.cpos === 1 : car.pos === 1);
      if (lead) {
        if (c.leaderIcon === 'ring') { ctx.lineWidth = 2 * unit; ctx.strokeStyle = c.leaderColor; ctx.beginPath(); ctx.arc(x, y, r + 3 * unit, 0, Math.PI * 2); ctx.stroke(); }
        else if (c.leaderIcon === 'star') star(x, y + r + 5.5 * unit, 4.5 * unit * sz, c.leaderColor);
        else crown(x, y + r + 5 * unit, unit * 0.9 * sz, c.leaderColor);
      }
      // Post-Pit-Indikator
      const ex = pitExit.get(car.idx);
      if (c.postPitShow && ex && now - ex < Number(c.postPitSeconds) * 1000) {
        const bx = x + r * 0.75, by = y - r * 0.75, bs = 7 * unit * sz;
        ctx.fillStyle = c.postPitColor; ctx.fillRect(bx - bs / 2, by - bs / 2, bs, bs);
        ctx.fillStyle = '#FFFFFF'; ctx.font = `800 ${bs * 0.85}px ${FONT}`; ctx.fillText('P', bx, by + 0.4 * unit);
      }
      ctx.globalAlpha = 1;
      if (labelled.has(car.idx)) labels.push([car, x, y, r]);
    }
    for (const l of labels) drawLabel(l[0], l[1], l[2], l[3], c);
  }

  // ---------- Wind ----------
  function drawWind(f, c, w, h) {
    const wd = f.map.wind;
    if (!wd) return;
    const k = Number(c.windSize) || 1;
    const R = 15 * unit * k, m = 6 * unit;
    const right = c.windPos === 'tr' || c.windPos === 'br', bottom = c.windPos === 'bl' || c.windPos === 'br';
    const cx = right ? w - R - m : R + m;
    const cy = bottom ? h - R - m - 16 * unit * k : R + m;
    ctx.fillStyle = 'rgba(18,19,22,0.85)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1 * unit; ctx.stroke();
    const rot = (Number(c.rotate) * Math.PI) / 180 * (c.mirror ? -1 : 1);
    ctx.font = `700 ${6.5 * unit * k}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#9A9AA0';
    ctx.fillText('N', cx + Math.sin(-rot) * (R - 5 * unit * k), cy - Math.cos(-rot) * (R - 5 * unit * k));
    // iRacing: WindDir = Richtung, aus der der Wind kommt (0 = Nord, im Uhrzeigersinn)
    const a = wd.dir + Math.PI - rot;
    const dx = Math.sin(a), dy = -Math.cos(a), L = R * 0.62;
    ctx.strokeStyle = OM.css('--gain'); ctx.fillStyle = OM.css('--gain'); ctx.lineWidth = 2 * unit * k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - dx * L, cy - dy * L); ctx.lineTo(cx + dx * L * 0.55, cy + dy * L * 0.55); ctx.stroke();
    const hw = 4.5 * unit * k;
    ctx.beginPath();
    ctx.moveTo(cx + dx * L, cy + dy * L);
    ctx.lineTo(cx + dx * L * 0.35 - dy * hw, cy + dy * L * 0.35 + dx * hw);
    ctx.lineTo(cx + dx * L * 0.35 + dy * hw, cy + dy * L * 0.35 - dx * hw);
    ctx.closePath(); ctx.fill();
    const txt = c.windUnit === 'ms' ? `${(wd.kph / 3.6).toFixed(1)} m/s` : `${Math.round(wd.kph)} km/h`;
    ctx.font = `700 ${8 * unit * k}px ${FONT}`;
    const tw = ctx.measureText(txt).width + 8 * unit;
    ctx.fillStyle = 'rgba(18,19,22,0.85)';
    ctx.fillRect(cx - tw / 2, cy + R + 3 * unit, tw, 12 * unit * k);
    ctx.fillStyle = '#E9E7E1';
    ctx.fillText(txt, cx, cy + R + 3 * unit + 6.5 * unit * k);
  }

  let lastKey = '';
  function draw(f) {
    const c = cfg();
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth, h = cv.clientHeight;
    const key = [w, h, c.rotate, c.mirror, c.padding, c.align, c.showTurns, c.trackWidth].join('|');
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); proj = null; }
    if (key !== lastKey) { lastKey = key; proj = null; }
    if (!proj) buildProjection(c);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    cv.style.opacity = String(Number(c.mapOpacity) || 1);
    const placeholder = !OM.track || !OM.track.length;
    drawTrack(c, f, placeholder);
    if (!f || placeholder) return;
    drawCars(f, c);
    if (c.showWind) drawWind(f, c, w, h);
  }

  function applyLook() {
    const c = cfg();
    document.body.classList.toggle('nobg', !c.showBg);
    document.body.classList.toggle('nohead', !c.showHeader);
  }

  window.addEventListener('resize', () => { proj = null; });

  OM.connect({
    onSettings() { proj = null; applyLook(); },
    onTrack() { proj = null; },
    onFrame(f, waiting) {
      const c = cfg();
      if (c.showHeader) OM.header(head, waiting ? 'Trackmap' : (f.track.name || 'Trackmap'), '');
      if (waiting) { note.textContent = c.showBg ? OM.waitingText : ''; draw(null); return; }
      note.textContent = f.map.recording
        ? `Für diese Strecke ist keine Karte hinterlegt. Sie wird aus deiner Fahrt aufgezeichnet (${Math.round(f.map.progress * 100)} %).`
        : '';
      draw(f);
    },
  });
</script>
</body>
</html>
